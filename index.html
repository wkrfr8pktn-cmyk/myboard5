<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script>
// ===== Supabase 配置 =====
const SUPABASE_URL = 'https://jfchuqpxmimjyxsxrixp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmY2h1cXB4bWltanl4c3hyaXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTQwMTksImV4cCI6MjA5NDY5MDAxOX0.ITbBlAn5aeKDCXtEuBFSm1rrYG_F5SXpG3FDridGbac';
const HEADERS = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
};

const enc = new TextEncoder();
const dec = new TextDecoder();

// ===== 页面切换 =====
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}

// ===== 加密工具 =====
async function deriveKey(seed) {
    const hash = await crypto.subtle.digest('SHA-256', enc.encode(seed));
    return crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
async function encrypt(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
    return {
        data: btoa(String.fromCharCode(...new Uint8Array(ct))),
        iv:   btoa(String.fromCharCode(...iv))
    };
}
async function decrypt(key, data, iv) {
    try {
        const ct  = new Uint8Array(atob(data).split('').map(c => c.charCodeAt(0)));
        const ivB = new Uint8Array(atob(iv).split('').map(c => c.charCodeAt(0)));
        const pt  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivB }, key, ct);
        return dec.decode(pt);
    } catch { return null; }
}

// ===== 主页留言功能 =====
let db = [];

async function fetchCloudMessages() {
    try {
        const res = await fetch(
            `${SUPABASE_URL}/rest/v1/messages?select=*&order=id.desc&limit=3`,
            { headers: HEADERS }
        );
        db = await res.json();
        renderBoard();
    } catch (e) {
        document.getElementById('publicBoard').innerHTML =
            '<p style="color:#de5d83;text-align:center;padding:16px;"><i class="fa-solid fa-circle-exclamation"></i> 信道连接异常</p>';
    }
}

async function handleEncrypt() {
    const name    = document.getElementById('encryptName').value.trim();
    const keyStr  = document.getElementById('encryptKey').value.trim();
    const content = document.getElementById('encryptContent').value.trim();
    const btn     = document.getElementById('sendBtn');
    if (!name || !keyStr || !content) { alert('请完整填写所有字段！'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 加密中...';

    try {
        const key = await deriveKey(name + '::' + keyStr);
        const { data, iv } = await encrypt(key, content);

        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: { ...HEADERS, 'Prefer': 'return=minimal' },
            body: JSON.stringify({ data, iv })
        });
        if (!res.ok) throw new Error();

        document.getElementById('encryptContent').value = '';
        document.getElementById('encryptResult').innerHTML =
            '<div class="result-box result-success"><i class="fa-solid fa-circle-check"></i> 留言已加密发布成功！</div>';
        await fetchCloudMessages();
    } catch {
        document.getElementById('encryptResult').innerHTML =
            '<div class="result-box result-error"><i class="fa-solid fa-triangle-exclamation"></i> 发布失败，请重试</div>';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-lock"></i> 生成加密留言并发布';
    }
}

async function handleDecryptAll() {
    const name   = document.getElementById('decryptName').value.trim();
    const keyStr = document.getElementById('decryptKey').value.trim();
    const btn    = document.getElementById('getBtn');
    if (!name || !keyStr) { alert('请填写名字和密钥！'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 检索中...';

    // 解密时拉全部数据
    try {
        const res = await fetch(
            `${SUPABASE_URL}/rest/v1/messages?select=*&order=id.desc&limit=100`,
            { headers: HEADERS }
        );
        const all = await res.json();
        const key = await deriveKey(name + '::' + keyStr);
        const found = [];
        for (const msg of all) {
            const text = await decrypt(key, msg.data, msg.iv);
            if (text !== null) found.push({ time: msg.created_at, content: text });
        }

        if (found.length > 0) {
            let html = `<div class="result-box result-success">
                <strong><i class="fa-solid fa-envelope-open-text"></i> 解密出 ${found.length} 条留言：</strong><hr style="margin:10px 0;border-color:#c3e6cb;">`;
            found.forEach(m => {
                html += `<p style="font-size:0.8rem;color:#6b7280;">🕒 ${new Date(m.time).toLocaleString('zh-CN')}</p>
                <p style="padding-left:10px;border-left:3px solid var(--accent);margin:4px 0 12px;">💌 ${m.content}</p>`;
            });
            document.getElementById('decryptResult').innerHTML = html + '</div>';
        } else {
            document.getElementById('decryptResult').innerHTML =
                '<div class="result-box result-error"><i class="fa-solid fa-triangle-exclamation"></i> 未找到属于你的留言，请检查名字和暗号是否正确</div>';
        }
    } catch {
        document.getElementById('decryptResult').innerHTML =
            '<div class="result-box result-error">网络错误，请重试</div>';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key"></i> 一键检索并解密';
    }
}

function renderBoard() {
    const board = document.getElementById('publicBoard');
    if (!db || db.length === 0) {
        board.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:16px;">暂无留言</p>';
        return;
    }
    board.innerHTML = db.map(msg => `
        <div class="board-item">
            <div class="board-meta"><i class="fa-solid fa-clock"></i> ${new Date(msg.created_at).toLocaleString('zh-CN')}</div>
            <div class="board-cipher">${msg.data.substring(0, 40)}... 🔒</div>
        </div>`).join('');
}

// ===== 蜂箱 / Talking =====
let talkKey = null;
let myName  = '';
let roomId  = '';
let talkPollTimer = null;
let lastMsgId = 0;

async function enterBeehive() {
    const nick = document.getElementById('myNickname').value.trim();
    const rKey = document.getElementById('roomKey').value.trim();
    const errEl = document.getElementById('beehiveError');

    if (!nick || !rKey) { errEl.textContent = '请填写昵称和暗号'; return; }

    myName = nick;
    // 用暗号的哈希作为房间ID（不存明文）
    const hashBuf = await crypto.subtle.digest('SHA-256', enc.encode('room::' + rKey));
    roomId = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('').substring(0, 24);
    talkKey = await deriveKey('talk::' + rKey);

    errEl.textContent = '';
    document.getElementById('talkSubtitle').textContent = `房间已加密 · 你好，${myName}`;
    showPage('talkingPage');
    lastMsgId = 0;
    await loadTalkMessages(true);
    talkPollTimer = setInterval(() => loadTalkMessages(false), 3000);
}

function leaveTalking() {
    if (talkPollTimer) { clearInterval(talkPollTimer); talkPollTimer = null; }
    talkKey = null; myName = ''; roomId = ''; lastMsgId = 0;
    document.getElementById('talkMessages').innerHTML = '';
    showPage('beehivePage');
}

async function loadTalkMessages(isFirst) {
    try {
        let url = `${SUPABASE_URL}/rest/v1/talk_messages?select=*&room_id=eq.${roomId}&order=id.asc`;
        if (!isFirst && lastMsgId > 0) url += `&id=gt.${lastMsgId}`;

        const res = await fetch(url, { headers: HEADERS });
        const msgs = await res.json();
        if (!Array.isArray(msgs) || msgs.length === 0) return;

        const container = document.getElementById('talkMessages');
        // 首次加载，清空占位
        if (isFirst) container.innerHTML = '';

        for (const msg of msgs) {
            const text = await decrypt(talkKey, msg.data, msg.iv);
            if (text === null) continue;
            const isMine = msg.sender === myName;
            const time   = new Date(msg.created_at).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });

            const row = document.createElement('div');
            row.className = `msg-row ${isMine ? 'mine' : ''}`;
            row.innerHTML = `
                <div class="msg-avatar-sm ${isMine ? 'mine-av' : 'theirs'}">${isMine ? '🐝' : '🕊️'}</div>
                <div class="msg-col">
                    <div class="msg-bubble ${isMine ? 'mine' : 'theirs'}">${escHtml(text)}</div>
                    <div class="msg-time">${isMine ? '' : msg.sender + ' · '}${time}</div>
                </div>`;
            container.appendChild(row);
            lastMsgId = Math.max(lastMsgId, msg.id);
        }
        container.scrollTop = container.scrollHeight;
    } catch(e) { console.error('加载消息失败', e); }
}

async function sendTalkMessage() {
    const input = document.getElementById('talkInput');
    const text  = input.value.trim();
    if (!text || !talkKey) return;

    const btn = document.getElementById('talkSendBtn');
    btn.disabled = true;
    input.value = '';

    try {
        const { data, iv } = await encrypt(talkKey, text);
        await fetch(`${SUPABASE_URL}/rest/v1/talk_messages`, {
            method: 'POST',
            headers: { ...HEADERS, 'Prefer': 'return=minimal' },
            body: JSON.stringify({ room_id: roomId, sender: myName, data, iv })
        });
        await loadTalkMessages(false);
    } catch(e) {
        console.error('发送失败', e);
    } finally {
        btn.disabled = false;
        input.focus();
    }
}

function handleTalkKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTalkMessage();
    }
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

fetchCloudMessages();
setInterval(fetchCloudMessages, 10000);
