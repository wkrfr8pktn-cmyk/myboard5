<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝对隐私 - 匿名加密留言板</title>
    
    <meta name="keywords" content="匿名留言版, 加密树洞, 绝对隐私留言, 零知识加密, 情感寄托">
    <meta name="description" content="一个纯净、治愈的匿名加密留言版。引入绿叶与和平鸽意象，采用军工级 AES-GCM 本地加密技术，全网同步互通。">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary-color: #6b8e23;
            --accent-color: #de5d83;
            --bg-color: #f4f6f0;
            --card-bg: #ffffff;
            --text-color: #2f3e46;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .header-area {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-top: 20px;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.2rem;
            margin: 10px 0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin: 0;
        }

        .illustration-pigeon {
            color: #ced4da;
            font-size: 2.5rem;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 4rem;
            opacity: 0.05;
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
        }
        .card.write-card::after { content: "\f06c"; color: var(--primary-color); }
        .card.read-card::after { content: "\f004"; color: var(--accent-color); }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #f1f3f5;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #495057;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s;
            background-color: #fafbfc;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(107, 142, 35, 0.1);
        }

        textarea {
            resize: vertical;
            height: 110px;
        }

        button {
            width: 100%;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-encrypt { background-color: var(--primary-color); }
        .btn-encrypt:hover { background-color: #55721c; }
        .btn-decrypt { background-color: var(--text-color); }
        .btn-decrypt:hover { background-color: #212a2e; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .message-list {
            margin-top: 12px;
        }

        .message-item {
            background: #fff;
            border: 1px solid #ebd9d9;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: inset 3px 0 0 var(--accent-color);
        }

        .meta {
            font-size: 0.85rem;
            color: #868e96;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cipher-text {
            word-break: break-all;
            font-family: monospace;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #6c757d;
            border: 1px dashed #dee2e6;
        }

        .success-box {
            background: #f4fbf7;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 14px;
            border-radius: 8px;
            margin-top: 16px;
            word-break: break-all;
        }
        
        .loading {
            text-align: center;
            color: #868e96;
            font-size: 0.9rem;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-area">
        <div class="illustration-pigeon">
            <i class="fa-solid fa-dove"></i>
        </div>
        <h1>匿名留言版</h1>
        <p class="subtitle">🍃 绿叶保护隐私，信鸽传递心意，爱心长存此地 🔒</p>
    </div>
    
    <div class="card write-card">
        <h2><i class="fa-solid fa-leaf" style="color: var(--primary-color);"></i> 1. 撰写加密留言</h2>
        <div class="form-group">
            <label>留言对象的名字 (严格区分大小写)</label>
            <input type="text" id="encryptName" placeholder="例如：小明">
        </div>
        <div class="form-group">
            <label>独享查看密钥</label>
            <input type="password" id="encryptKey" placeholder="输入只有你们俩知道的暗号">
        </div>
        <div class="form-group">
            <label>留言内容</label>
            <textarea id="encryptContent" placeholder="写下你想对TA说的话，代码将在本地将其加密..."></textarea>
        </div>
        <button class="btn-encrypt" id="sendBtn" onclick="handleEncrypt()">
            <i class="fa-solid fa-user-lock"></i> 生成加密留言并发布到网络大厅
        </button>
        <div id="encryptResult"></div>
    </div>

    <div class="card read-card">
        <h2><i class="fa-solid fa-heart" style="color: var(--accent-color);"></i> 2. 提取并解密留言</h2>
        <div class="form-group">
            <label>你的名字</label>
            <input type="text" id="decryptName" placeholder="必须与对方留信时完全一致">
        </div>
        <div class="form-group">
            <label>查看密钥</label>
            <input type="password" id="decryptKey" placeholder="请输入正确的暗号">
        </div>
        <button class="btn-decrypt" id="getBtn" onclick="handleDecryptAll()">
            <i class="fa-solid fa-key"></i> 一键检索并解密
        </button>
        <div id="decryptResult"></div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-earth-asia" style="color: #4ba3e3;"></i> 🌐 云端公开大厅 (所有人能看到的只有密文)</h2>
        <div id="publicBoard" class="message-list">
            <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 正在同步全网加密信道...</div>
        </div>
    </div>
</div>

<script>
    // ===== JSONBin 配置 =====
    const BIN_ID  = '6a0b2d5f6610dd3ae865ba2c';
    const API_KEY = '$2a$10$XbaZEhcmV2.0HdjuRQoRL.y3DJvTQFKq6D1cwf461BoSB8Buo3X56';
    const READ_URL  = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
    const WRITE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    // ========================

    let db = [];
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();

    async function deriveKey(name, keyStr) {
        const secretMaterial = textEncoder.encode(name + "::" + keyStr);
        const hash = await crypto.subtle.digest('SHA-256', secretMaterial);
        return await crypto.subtle.importKey(
            'raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']
        );
    }

    // 从 JSONBin 读取所有留言
    async function fetchCloudMessages() {
        try {
            const response = await fetch(READ_URL, {
                headers: { 'X-Master-Key': API_KEY }
            });
            if (!response.ok) throw new Error('读取失败');
            const result = await response.json();
            // JSONBin 把数据包在 record 字段里
            db = Array.isArray(result.record) ? result.record : [];
            renderBoard();
        } catch (e) {
            console.error("同步云端失败：", e);
            document.getElementById('publicBoard').innerHTML =
                '<p style="color:#de5d83; text-align:center; padding:20px;"><i class="fa-solid fa-circle-exclamation"></i> 信道连接异常，请检查网络</p>';
        }
    }

    // 发送加密留言
    async function handleEncrypt() {
        const name    = document.getElementById('encryptName').value.trim();
        const keyStr  = document.getElementById('encryptKey').value.trim();
        const content = document.getElementById('encryptContent').value;
        const sendBtn = document.getElementById('sendBtn');

        if (!name || !keyStr || !content) {
            alert('请完整填写名字、密钥和留言内容！');
            return;
        }

        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在进行本地高强度加密...';

        try {
            const key = await deriveKey(name, keyStr);
            const iv  = crypto.getRandomValues(new Uint8Array(12));
            const encodedContent = textEncoder.encode(content);

            const ciphertext  = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encodedContent);
            const cipherBase64 = btoa(String.fromCharCode(...new Uint8Array(ciphertext)));
            const ivBase64     = btoa(String.fromCharCode(...iv));

            const newMessage = {
                time: new Date().toLocaleString('zh-CN'),
                data: cipherBase64,
                iv:   ivBase64
            };

            // 先拉取最新数据，再追加，防止覆盖别人的留言
            try {
                const checkRes = await fetch(READ_URL, { headers: { 'X-Master-Key': API_KEY } });
                if (checkRes.ok) {
                    const checkResult = await checkRes.json();
                    db = Array.isArray(checkResult.record) ? checkResult.record : [];
                }
            } catch(err) {}

            db.unshift(newMessage);
            if (db.length > 100) db.pop(); // 最多保留100条

            // 写入 JSONBin（PUT 方法更新整个 Bin）
            const writeRes = await fetch(WRITE_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(db)
            });

            if (!writeRes.ok) throw new Error('写入失败');

            document.getElementById('encryptContent').value = '';
            document.getElementById('encryptResult').innerHTML = `
                <div class="success-box">
                    <i class="fa-solid fa-circle-check"></i> 成功！留言已通过本地加密，并安全同步至全网公开大厅。
                </div>`;
            renderBoard();
        } catch (e) {
            console.error(e);
            alert('云端同步失败，请重试');
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fa-solid fa-user-lock"></i> 生成加密留言并发布到网络大厅';
        }
    }

    async function decryptMessage(msg, name, keyStr) {
        try {
            const key        = await deriveKey(name, keyStr);
            const iv         = new Uint8Array(atob(msg.iv).split('').map(c => c.charCodeAt(0)));
            const ciphertext = new Uint8Array(atob(msg.data).split('').map(c => c.charCodeAt(0)));
            const decrypted  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
            return textDecoder.decode(decrypted);
        } catch (e) { return null; }
    }

    // 解密检索留言
    async function handleDecryptAll() {
        const name      = document.getElementById('decryptName').value.trim();
        const keyStr    = document.getElementById('decryptKey').value.trim();
        const resultDiv = document.getElementById('decryptResult');
        const getBtn    = document.getElementById('getBtn');

        if (!name || !keyStr) {
            alert('请输入名字和密钥进行解密！');
            return;
        }

        getBtn.disabled = true;
        getBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在打捞全网信道...';

        await fetchCloudMessages();

        let foundMessages = [];
        for (let msg of db) {
            const clearText = await decryptMessage(msg, name, keyStr);
            if (clearText !== null) {
                foundMessages.push({ time: msg.time, content: clearText });
            }
        }

        if (foundMessages.length > 0) {
            let html = `
                <div class="success-box" style="background:#f4fbf7; color:#155724; border-color:#c3e6cb;">
                    <p><strong><i class="fa-solid fa-envelope-open-text"></i> 成功从网络大厅解密出 ${foundMessages.length} 条属于你的留言：</strong></p>
                    <hr style="border-color:#c3e6cb">`;
            foundMessages.forEach(m => {
                html += `
                    <p style="font-size:0.85rem; color:#666;">🕒 投递时间：${m.time}</p>
                    <p style="font-size:1.05rem; padding-left:10px; border-left:3px solid var(--accent-color);">
                        💌 <strong>内容：</strong>${m.content}
                    </p>
                    <hr style="border:0; border-top:1px dashed #c3e6cb;">`;
            });
            html += `</div>`;
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = `
                <div class="success-box" style="background:#fef2f2; border-color:#fecaca; color:#991b1b;">
                    <i class="fa-solid fa-triangle-exclamation"></i> 全网大厅里未匹配到属于你的留言（请检查名字、暗号是否正确）。
                </div>`;
        }

        getBtn.disabled = false;
        getBtn.innerHTML = '<i class="fa-solid fa-key"></i> 一键检索并解密';
    }

    function renderBoard() {
        const board = document.getElementById('publicBoard');
        if (db.length === 0) {
            board.innerHTML = '<p style="color:#9ca3af; text-align:center; padding:20px;"><i class="fa-solid fa-box-open"></i> 全网大厅暂无留言，快来发布第一条吧！</p>';
            return;
        }
        board.innerHTML = db.map(msg => `
            <div class="message-item">
                <div class="meta"><i class="fa-solid fa-clock"></i> 同步时间：${msg.time} | <i class="fa-solid fa-cloud"></i> 状态：🔒 全网加密传输</div>
                <div class="cipher-text">${msg.data.substring(0, 35)}... [内容已被爱心与绿叶封印，无钥匙不可破]</div>
            </div>
        `).join('');
    }

    fetchCloudMessages();
    // 每10秒自动刷新一次
    setInterval(fetchCloudMessages, 10000);
</script>

</body>
</html>
